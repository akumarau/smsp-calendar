name: Update Sydney Motorsport Park calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "15 18 * * *"
  push:
    branches: [main]
    paths:
      - "scraper.py"
      - "requirements.txt"
      - ".github/workflows/update-calendar.yml"

permissions:
  contents: write

concurrency:
  group: smsp-calendar-update
  cancel-in-progress: false

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Scrape calendar and build ICS
        run: python scraper.py

      - name: Commit refreshed calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/calendar.ics docs/events.json docs/debug.json
          if git diff --cached --quiet; then
            echo "No calendar changes."
          else
            git commit -m "Update Sydney Motorsport Park calendar"
            git push
          fi
